<svg xmlns="http://www.w3.org/2000/svg" width="880" height="264" viewBox="0 0 880 264" role="img" aria-labelledby="title description">
  <title id="title">Codex activity</title>
  <desc id="description">Lifetime tokens, current streak, and peak daily tokens. Refreshed 2026-09-24.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1419"/>
      <stop offset="1" stop-color="#102127"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#86f2c3"/>
      <stop offset="1" stop-color="#74bcf9"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop offset="0" stop-color="#218a84" stop-opacity=".18"/>
      <stop offset="1" stop-color="#218a84" stop-opacity="0"/>
    </radialGradient>
    <pattern id="matrix" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#9cebd2" opacity=".14"/>
    </pattern>
    <clipPath id="rounding"><rect x="1" y="1" width="878" height="262" rx="22"/></clipPath>
  </defs>

  <rect x=".5" y=".5" width="879" height="263" rx="22" fill="url(#surface)" stroke="#294248"/>
  <g clip-path="url(#rounding)">
    <circle cx="725" cy="108" r="240" fill="url(#aura)"/>
    <rect x="562" y="0" width="318" height="264" fill="url(#matrix)"/>
    <path d="M0 0h880" stroke="url(#signal)" stroke-width="3"/>
    <path d="M32 224h816" stroke="#345057" stroke-opacity=".65"/>
  </g>

  <g fill="none" stroke="url(#signal)" stroke-width="1.7" stroke-linejoin="round">
    <path d="M43 42l8-8 8 8-8 8z"/>
    <path d="M51 29v5m0 16v5M38 42h5m16 0h5" opacity=".65"/>
  </g>
  <text x="76" y="47" fill="#d8f3ea" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.2">CODEX <tspan fill="#6d9e9d">/</tspan> ACTIVITY</text>
  <text id="updated-at" x="848" y="47" text-anchor="end" fill="#91afa9" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.1">REFRESHED · SEP 24, 2026</text>

  <text x="40" y="92" fill="#91afa9" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2.1">LIFETIME TOKENS</text>
  <text id="lifetime-count" x="35" y="180" fill="url(#signal)" font-family="Segoe UI, Arial, sans-serif" font-size="91" font-weight="750" letter-spacing="-5">36.4B</text>
  <text x="42" y="207" fill="#a9c3be" font-family="Segoe UI, Arial, sans-serif" font-size="13">Ideas explored. Code shipped. Still building.</text>

  <path d="M548 75v132" stroke="#35545a"/>
  <text x="580" y="93" fill="#91afa9" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.8">CURRENT STREAK</text>
  <text id="streak-count" x="576" y="153" fill="#effcf6" font-family="Segoe UI, Arial, sans-serif" font-size="59" font-weight="730" letter-spacing="-2">18</text>
  <text x="649" y="150" fill="#8fe7c2" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.3">DAYS</text>
  <path d="M580 173h248" stroke="#35545a"/>
  <text x="580" y="200" fill="#91afa9" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.7">PEAK DAY</text>
  <text id="peak-count" x="828" y="201" text-anchor="end" fill="#d7f4ee" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="-.7">2.5B</text>

  <text x="41" y="246" fill="#6f9896" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">HUMAN DIRECTION  /  MACHINE SCALE</text>
  <circle cx="713" cy="242" r="3" fill="#8fe7c2"/>
  <text id="refresh-state" x="848" y="246" text-anchor="end" fill="#84aaa3" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">DAILY SYNC</text>
</svg>
